[package]
name = "example_risc_v_esp32c6"
version = "0.4.0"
edition = "2021"

[profile.release]
debug = true

[dependencies]
# Specifying Martos version
#martos = "0.4.0"
# Specifying current Martos version path for ci
martos = { path = "../../../../", features = ["network"] }
esp-hal = "~1.2.0"
esp-backtrace = { version = "0.20", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.18", features = ["esp32c6"] }
esp-radio = { version = "1.0.0-beta.1", features = ["wifi", "esp-now", "unstable"] }

[features]
default = ["martos/esp32c6", "esp-backtrace/esp32c6", "esp-println/esp32c6"]
