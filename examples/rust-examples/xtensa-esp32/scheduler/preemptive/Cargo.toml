[package]
name = "example_xtensa_esp32_scheduler"
version = "0.3.0"
edition = "2021"

[profile.release]
debug = true

[dependencies]
# Specifying Martos version
#martos = "0.3.0"
# Specifying current Martos version path for ci
martos = { path = "../../../../../", features = ["preemptive"] }
esp-hal = "~1.2.0"
esp-backtrace = { version = "0.20", features = ["esp32", "panic-handler", "println"] }
esp-println = { version = "0.18", features = ["esp32"] }

[features]
default = ["martos/esp32", "esp-backtrace/esp32", "esp-println/esp32"]
