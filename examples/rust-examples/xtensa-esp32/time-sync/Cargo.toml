[package]
name = "time-sync"
version = "0.1.0"
edition = "2021"

[dependencies]
martos = { path = "../../../../", features = ["network"] }
esp-hal = "~1.2.0"
esp-backtrace = { version = "0.20", features = ["esp32", "panic-handler", "println"] }
esp-println = { version = "0.18", features = ["esp32"] }
esp-radio = { version = "1.0.0-beta.1", features = ["wifi", "esp-now", "unstable"] }
static_cell = "2.0.0"

[features]
default = ["martos/esp32", "esp-backtrace/esp32", "esp-println/esp32"]
