      - name: Build
        run: cd ./examples/rust-examples/xtensa-esp32/uart && . /root/export-esp.sh && cargo build
      - name: Fmt
        run: cd ./examples/rust-examples/xtensa-esp32/uart && cargo fmt --all -- --check

  xtensa-esp32-static-library:
    runs-on: ubuntu-latest
    env:
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
      # Keep intermediate artifacts (build script out dirs with linker scripts)
      # in a known location even if the image config relocates them.
      CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/cargo-build-dir
    container:
      image: arkhipovivan1/xtensa-esp32-rust:latest
      options: --user root
    steps:
      - uses: actions/checkout@v3
      - name: Build
        run: cd ./c-library/xtensa-esp32 && . /root/export-esp.sh && cargo build --release
      - name: Collect linker scripts
        run: |
          cd c-library/xtensa-esp32
          REL=target/xtensa-esp32-none-elf/release
          echo "--- cargo/rustup env:"
          env | grep -iE 'cargo|rustup' || true
          cargo --version
          echo "--- release dir:"
          ls -la "$REL" || true
          OUTS=$(find / -xdev -type d -path "*/build/*/out" 2>/dev/null | grep -E '/(esp-hal|esp32|esp32c6|xtensa-lx-rt|esp-riscv-rt|esp-rom-sys)-[^/]*/out$' | sort -u || true)
          if [ -z "$OUTS" ]; then
            echo "ERROR: esp-hal linker script out dirs not found after build"
            find / -xdev -maxdepth 8 -type d -name "esp-hal-*" 2>/dev/null | head -20
            exit 1
          fi
          for d in $OUTS; do
            case "$d" in "$REL"/build/*) continue ;; esac
            mkdir -p "$REL/build/$(basename "$(dirname "$d")")"
            cp -r "$d" "$REL/build/$(basename "$(dirname "$d")")/out"
          done
          A=$(find / -xdev -name libxtensa_esp32_static_lib.a 2>/dev/null | head -1)
          case "$A" in "$REL"/*) ;; *) cp -f "$A" "$REL/" ;; esac
          ls "$REL/build"
      - name: Fmt
        run: cd ./c-library/xtensa-esp32 && cargo fmt --all -- --check
      - name: Package static library with linker scripts
        run: |
          cd c-library/xtensa-esp32/target/xtensa-esp32-none-elf/release
          tar czf "$GITHUB_WORKSPACE/xtensa-esp32-static-library.tar.gz" \
            libxtensa_esp32_static_lib.a \
            build/esp-hal-*/out build/esp32-*/out build/xtensa-lx-rt-*/out build/esp-rom-sys-*/out
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xtensa-esp32-static-library
          path: xtensa-esp32-static-library.tar.gz
          retention-days: 7

  xtensa-esp32-c-example:
    needs: xtensa-esp32-static-library
    runs-on: ubuntu-latest
    env:
      IDF_PATH: /root/esp/esp-idf
      IDF_TOOLS_PATH: /root/.espressif
    container:
      image: arkhipovivan1/xtensa-esp32-c:latest
      options: --user root
    steps:
      - uses: actions/checkout@v3
      - name: Download static library
        uses: actions/download-artifact@v4
        with:
          name: xtensa-esp32-static-library
      - name: Extract static library
        run: |
          mkdir -p c-library/xtensa-esp32/target/xtensa-esp32-none-elf/release
          tar xzf xtensa-esp32-static-library.tar.gz -C c-library/xtensa-esp32/target/xtensa-esp32-none-elf/release
      - name: Build
        run: cd ./examples/c-examples/xtensa-esp32 && . /root/esp/esp-idf/export.sh && make && esptool.py --chip esp32 elf2image --flash_mode="dio" --flash_freq="40m" --flash_size="4MB" -o main.bin main.elf


